# Docker Compose 초안

version: '3.8'

services:
  # ============================================
  # 데이터베이스
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: syncml-db
    environment:
      POSTGRES_DB: syncml_ota
      POSTGRES_USER: syncml
      POSTGRES_PASSWORD: syncml_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - private-net
    ports:
      - "5432:5432"  # 개발용, 운영 시 제거

  # ============================================
  # 메시지 브로커 (Phase 2)
  # ============================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: syncml-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: syncml
      RABBITMQ_DEFAULT_PASS: syncml_password
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    networks:
      - private-net

  # ============================================
  # Java SyncML 서버
  # ============================================
  syncml-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syncml-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/syncml_ota
      SPRING_DATASOURCE_USERNAME: syncml
      SPRING_DATASOURCE_PASSWORD: syncml_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - public-net
      - private-net

  # ============================================
  # Vue 3 대시보드
  # ============================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: syncml-dashboard
    ports:
      - "3000:80"
    depends_on:
      - syncml-server
    networks:
      - public-net

  # ============================================
  # Django 운영 서버
  # ============================================
  django-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: syncml-admin
    environment:
      DATABASE_URL: postgres://syncml:syncml_password@postgres:5432/syncml_ota
    ports:
      - "8000:8000"  # 내부 운영용
    depends_on:
      - postgres
    networks:
      - private-net

  # ============================================
  # 단말 시뮬레이터 (Phase 2: 컨테이너 분리)
  # ============================================
  device-sim-1:
    build:
      context: ./device-simulator
      dockerfile: Dockerfile
    container_name: device-sim-1
    environment:
      DEVICE_VIN: VIN-0001
      DEVICE_MODEL: TEST-MODEL-A
      SYNCML_SERVER_URL: http://syncml-server:8080
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - syncml-server
      - rabbitmq
    networks:
      - private-net

  device-sim-2:
    build:
      context: ./device-simulator
      dockerfile: Dockerfile
    container_name: device-sim-2
    environment:
      DEVICE_VIN: VIN-0002
      DEVICE_MODEL: TEST-MODEL-B
      SYNCML_SERVER_URL: http://syncml-server:8080
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - syncml-server
      - rabbitmq
    networks:
      - private-net

  device-sim-3:
    build:
      context: ./device-simulator
      dockerfile: Dockerfile
    container_name: device-sim-3
    environment:
      DEVICE_VIN: VIN-0003
      DEVICE_MODEL: TEST-MODEL-C
      SYNCML_SERVER_URL: http://syncml-server:8080
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - syncml-server
      - rabbitmq
    networks:
      - private-net

# ============================================
# 네트워크 정의
# ============================================
networks:
  public-net:
    driver: bridge
    name: syncml-public
  private-net:
    driver: bridge
    name: syncml-private
    internal: true  # 외부 접근 차단

# ============================================
# 볼륨 정의
# ============================================
volumes:
  postgres_data:

